name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Same pins as release.yml, so a green CI run means the release build works.
  FORGE_VERSION: v0.4.1
  QT_VERSION: 6.8.3

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the version and AUMID declarations agree
        shell: pwsh
        run: ./scripts/Check-Metadata.ps1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: jurplel/install-qt-action@v4
        with:
          modules: qtshadertools
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build and test
        shell: pwsh
        run: |
          $env:QMAKE = "$env:QT_ROOT_DIR\bin\qmake.exe"
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build exited $LASTEXITCODE" }
          cargo test --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test exited $LASTEXITCODE" }

      - name: Stage the payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target/release/pingy.exe, LICENSE stage/
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
            --qmldir qml stage/pingy.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt exited $LASTEXITCODE" }

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge --pattern '*.exe' --dir tools

      # Builds the installer unsigned on every push, so a bad token, a `when`
      # naming an option that no longer exists, or a payload path that stopped
      # matching fails here rather than at release time.
      - name: Forge a development installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build `
            --config installer.toml `
            --payload stage `
            --stub tools/lwstub.exe `
            --out dist/Pingy-Setup-dev.exe `
            --dev
          if ($LASTEXITCODE -ne 0) { throw "forge exited $LASTEXITCODE" }

          ./tools/lwforge.exe inspect dist/Pingy-Setup-dev.exe
          if ($LASTEXITCODE -ne 0) { throw 'the installer cannot read its own container' }

      - uses: actions/upload-artifact@v7
        with:
          name: Pingy-dev-windows
          path: dist/Pingy-Setup-dev.exe

  linux:
    runs-on: ubuntu-24.04
    env:
      QMAKE: /usr/lib/qt6/bin/qmake
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The distribution's Qt 6.4, the oldest the app supports, so an API from a
      # newer Qt fails here rather than in the .deb job.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl-dev \
            qt6-base-dev qt6-declarative-dev qt6-shader-baker \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates

      - name: Build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: jurplel/install-qt-action@v4
        with:
          modules: qtshadertools
          version: ${{ env.QT_VERSION }}
          cache: true

      # See release.yml: Qt 6.8.3 against the macos-26 SDK.
      - name: macOS compiler workaround
        run: |
          echo "CXXFLAGS=-include arm_acle.h" >> "$GITHUB_ENV"
          grep -rlI -- '-framework AGL' "$QT_ROOT_DIR/mkspecs" "$QT_ROOT_DIR/lib" 2>/dev/null \
            | while read -r f; do sed -i '' 's/-framework AGL//g' "$f"; done
          ! grep -rqI -- '-framework AGL' "$QT_ROOT_DIR/mkspecs" "$QT_ROOT_DIR/lib"

      - name: Build and test
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          cargo build --release --locked
          cargo test --release --locked
