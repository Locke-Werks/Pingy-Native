[product]
name         = "Pingy"
version      = "2.0.0"
publisher    = "Locke Werks"
description  = "Real-time network ping visualizer. 3D perspective graph."
copyright    = "Copyright (c) 2026 Locke Werks"
url          = "https://github.com/lockewerks/Pingy-Native"
# Stable across versions. Upgrade detection and the single-instance mutex key off
# this, so changing it makes an upgrade look like a fresh product.
upgrade_code = "ef30e1aa-84ad-4e61-8839-193ec66fb747"
# No version component, so taskbar pins survive an upgrade.
aumid        = "LockeWerks.Pingy"
# Literal string, so the backslash stays a backslash. Relative to this file.
icon         = 'assets\pingy-native.ico'

[install]
# Machine scope: the PATH entry goes in HKLM so Pingy resolves for every account
# on the box, not just the one that ran setup.
scope     = "machine"
dir       = "{ProgramFiles}\\Pingy"
elevation = "required"

[ui]
license_text = """
Pingy
Copyright (C) 2026 Locke Werks

This program is free software: you can redistribute it and/or modify it under
the terms of the GNU General Public License as published by the Free Software
Foundation, either version 3 of the License, or (at your option) any later
version.

This program is distributed in the hope that it will be useful, but WITHOUT ANY
WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A
PARTICULAR PURPOSE. See the GNU General Public License for more details.

The full license text is installed beside the program as LICENSE, and is at
https://www.gnu.org/licenses/gpl-3.0.html.
"""

[[options]]
id      = "add_to_path"
label   = "Add Pingy to the system PATH"
detail  = "Lets you run `Pingy` from any terminal. Changes PATH for every user on this machine."
default = true

[[options]]
id      = "desktop_shortcut"
label   = "Put a shortcut on the desktop"
default = false

# Qt 6.8 does not support anything older than Windows 10 1809, and the payload
# is built against it.
[[preflight]]
type = "os_build"
min  = 17763
fail = "Windows 10 version 1809 or later is required."

# A running Pingy holds its own image open, so the copy would fail partway
# through. restart_manager offers to close it instead of dead-ending.
[[preflight]]
type            = "process_not_running"
name            = "pingy.exe"
restart_manager = true
fail            = "Close Pingy before installing."

[[actions]]
type   = "shortcut"
target = "{InstallDir}\\pingy.exe"
where  = "common_programs"
name   = "Pingy"

[[actions]]
type   = "shortcut"
target = "{InstallDir}\\pingy.exe"
where  = "desktop"
name   = "Pingy"
when   = "desktop_shortcut"

# The install directory itself. The Qt runtime sits beside pingy.exe, so its
# DLLs are on PATH too; every Qt app loads its own copy first, so they shadow
# nothing.
[[actions]]
type  = "path_append"
value = "{InstallDir}"
when  = "add_to_path"

[[actions]]
type = "arp"
